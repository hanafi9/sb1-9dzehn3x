# ═══════════════════════════════════════════════════════════════════
#  led-effects.cfg — animations du ruban FCOB WS2811
#
#  Necessite le module klipper-led_effect (julianschill). Verifier :
#      ls -l ~/klipper/klippy/extras/led_effect.py
#  S'il manque :
#      ~/klipper-led_effect/install-led_effect.sh
#
#  Pourquoi ce module plutot que des macros : il anime en tache de fond, a
#  frame_rate images par seconde, independamment du gestionnaire de commandes.
#  M190 et M109 gardent ce gestionnaire jusqu'a la consigne — une animation
#  ecrite en delayed_gcode reste donc figee pendant toute la chauffe, ce qui
#  est precisement le moment ou l'on voudrait la voir.
#
#  ── SYNTAXE D'UNE COUCHE ──────────────────────────────────────────
#      <effet>  <vitesse>  <parametre>  <fusion>  <palette>
#  Les couches se superposent de BAS en HAUT : la derniere ecrite est au
#  fond. D'ou le `static ... bottom` en dernier, qui sert de fond continu.
#
#  ── COMMANDES ─────────────────────────────────────────────────────
#      SET_LED_EFFECT EFFECT=<nom> REPLACE=1     lance et remplace
#      STOP_LED_EFFECTS                          arrete tout
# ═══════════════════════════════════════════════════════════════════


# ─── Chauffe — comete bleue qui parcourt le ruban ──────────────────
# La vitesse monte avec la temperature ? Non : led_effect ne sait pas le
# faire seul. C'est STATUS_HEATING_* qui choisit entre ces deux vitesses
# selon la consigne — lent pour un plateau, rapide pour une buse.

[led_effect ef_chauffe_lente]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    comet   0.5  4  add      (0.0,0.35,1.0),(0.0,0.05,0.35)
    static  0    0  bottom   (0.0,0.0,0.06)

[led_effect ef_chauffe_rapide]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    comet   1.4  4  add      (0.0,0.35,1.0),(0.0,0.05,0.35)
    static  0    0  bottom   (0.0,0.0,0.06)


# ─── Homing — balayage cyan, rapide et nerveux ─────────────────────

[led_effect ef_homing]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    chase   1.6  3  add      (0.0,0.7,1.0),(0.0,0.15,0.3)
    static  0    0  bottom   (0.0,0.02,0.05)


# ─── Z-tilt — deux cometes violettes, lentes et regulieres ─────────

[led_effect ef_zilt]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    comet   0.7  6  add      (0.7,0.0,1.0),(0.15,0.0,0.3)
    static  0    0  bottom   (0.04,0.0,0.06)


# ─── Bed mesh — balayage vert d'eau, comme la sonde qui quadrille ──

[led_effect ef_mesh]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    chase   0.9  4  add      (0.0,1.0,0.45),(0.0,0.25,0.12)
    static  0    0  bottom   (0.0,0.05,0.02)


# ─── Impression — BLANC FIXE, volontairement ───────────────────────
# Pas d'animation ici, et c'est un choix : la webcam a besoin d'un
# eclairage constant. Une lumiere qui varie fait pomper l'exposition
# automatique, et le workflow n8n analyse ces images pour detecter les
# anomalies — des variations de luminosite lui donneraient de fausses
# alertes. L'animation sert a signaler ce qui se PREPARE ; une fois que
# ca imprime, on veut juste voir.

[led_effect ef_impression]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    static  0  0  top  (1.0,1.0,1.0)


# ─── Pause — orange qui respire ────────────────────────────────────

[led_effect ef_pause]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    breathing  3  0  top  (1.0,0.35,0.0)


# ─── Termine — vert qui respire doucement ──────────────────────────

[led_effect ef_fini]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    breathing  6  0  top  (0.0,1.0,0.15)


# ─── Erreur — rouge stroboscopique, impossible a rater ─────────────

[led_effect ef_erreur]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    strobe  1.2  0.4  add      (1.0,0.0,0.0)
    static  0    0    bottom   (0.15,0.0,0.0)


# ─── Veille — lueur froide, presque eteinte ────────────────────────

[led_effect ef_veille]
leds:
    neopixel:cob_led
autostart: false
frame_rate: 24
layers:
    breathing  10  0  top  (0.1,0.1,0.15)


# ═══════════════════════════════════════════════════════════════════
#  TEST — enchaine toutes les animations, 4 s chacune
# ═══════════════════════════════════════════════════════════════════

[gcode_macro EFFETS_TEST]
description: Passe en revue toutes les animations du ruban
gcode:
    {% for nom in ['ef_chauffe_lente', 'ef_chauffe_rapide', 'ef_homing',
                   'ef_zilt', 'ef_mesh', 'ef_impression', 'ef_pause',
                   'ef_fini', 'ef_erreur', 'ef_veille'] %}
        M117 {nom}
        SET_LED_EFFECT EFFECT={nom} REPLACE=1
        G4 P4000
    {% endfor %}
    STOP_LED_EFFECTS
    M117 Fin du test
