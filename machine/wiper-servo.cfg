# ═══════════════════════════════════════════════════════════════════════════
#  NETTOYAGE DE BUSE — brosse metallique deployee par servo
#  Modele : « VCore Nozzle Wiper » de WiggyWooSaa
#
#  Remplace machine/nozzle-wiper.cfg, qui decrivait une brosse FIXE. Ne pas
#  inclure les deux : ils font le meme travail de deux facons differentes.
#
#  ── POURQUOI UN SERVO ICI ────────────────────────────────────────────────
#  Sur une VCore le portique est fixe en Z, donc une brosse fixe suffirait en
#  principe. Mais ce modele-ci place la brosse DANS la zone balayee par la
#  tete : sans retrait, elle serait percutee a chaque deplacement. Le servo
#  n'est pas un luxe, c'est ce qui rend ce montage possible.
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
#  ⚠️ ALIMENTATION DU SERVO — A LIRE AVANT DE BRANCHER
#
#  Un MG995 tire jusqu'a 1,5 a 2 A quand il force. Le rail 5 V de l'Octopus
#  alimente aussi le microcontroleur : un appel de courant pareil le fait
#  redemarrer en pleine impression, voire grille le regulateur.
#
#      ROUGE  (5 V)    -> alimentation 5 V EXTERNE (convertisseur 24->5 V, 2 A)
#      NOIR   (GND)    -> masse de cette alimentation ET masse de la carte
#                         (masse commune OBLIGATOIRE, sinon pas de reference)
#      ORANGE (signal) -> broche signal de PG11 sur la carte
#
#  Ne JAMAIS prendre le 5 V sur la carte. La broche de signal, elle, ne
#  transporte aucun courant : elle ne risque rien.
# ═══════════════════════════════════════════════════════════════════════════

[servo servo_wiper]
pin: PG11                        # port d'endstop libre sur cette machine
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 145               # position RETRACTEE au demarrage


# ═══════════════════════════════════════════════════════════════════════════
#  REGLAGES — A MESURER AVANT LA PREMIERE UTILISATION
#
#  Les valeurs d'origine de l'auteur (X275, Y260-300) viennent de SA machine.
#  Les tiennes dependent de l'endroit ou tu visses le support sur le profile.
#
#  Marche a suivre, imprimante allumee, brosse montee :
#    1. G28, puis G1 Z80 F1500 pour degager le plateau
#    2. SET_SERVO SERVO=servo_wiper ANGLE=50     -> la brosse se deploie
#    3. Depuis les controles Mainsail, amene la buse au contact de la brosse.
#       Releve le X de la brosse -> x_wipe, et les deux extremites de la
#       course -> y_min / y_max
#    4. Regarde l'arc que la brosse decrit en sortant et en rentrant, et
#       choisis un x_safe / y_safe nettement en dehors
#    5. SET_SERVO SERVO=servo_wiper ANGLE=145    -> elle se retracte
#    6. Reporte les valeurs ci-dessous, puis ENREGISTRER ET REDEMARRER
#
#  🛟 Commence par un balayage LENT (speed 3000) pour verifier la trajectoire
#     avant de remonter la vitesse.
# ═══════════════════════════════════════════════════════════════════════════

[gcode_macro _WIPER_CONF]
# Brosse posee le long du montant GAUCHE : X reste fixe, la buse la parcourt
# en Y sur 134 mm. Valeurs relevees sur la machine.
variable_x_wipe:       10    # X de la brosse, fixe (mm)
variable_y_min:       254    # Y — debut du balayage (mm)
variable_y_max:       388    # Y — fin du balayage (mm)
# Point de degagement, HORS de l'arc balaye par la brosse quand elle sort.
# La tete s'y range AVANT chaque mouvement du servo, a l'aller comme au
# retour, sinon la brosse la percute — ou c'est le bras qui plie.
variable_x_safe:      200    # X du point de degagement (mm)
variable_y_safe:      200    # Y du point de degagement (mm)
# Le plateau doit descendre SOUS la brosse et son bras, sinon ils se
# percutent au deploiement. Sur une VCore, Z est l'ecart buse-plateau : un Z
# plus GRAND descend le plateau. La brosse essuyant la buse, elle est a
# hauteur de buse — 10 mm ne degageaient donc que le vide sous la buse, pas
# l'epaisseur du mecanisme.
#
# Pour trouver la valeur : brosse deployee, descends le plateau franchement
# (G1 Z80), puis remonte-le par pas de 5 mm (Z79, Z75, Z70...) jusqu'a
# friser le bras. Note ce Z, ajoute 10 mm de marge.
variable_z_safe:       50    # ⚠️ A VERIFIER — Z degageant la brosse (mm)
variable_angle_deploy:  50   # angle brosse DEPLOYEE (degres)
variable_angle_park:   145   # angle brosse RETRACTEE (degres)
variable_passes:         6   # allers-retours
variable_speed:      12000   # vitesse de balayage (mm/min)
variable_temp:         180   # temperature d'essuyage (°C)
gcode:
    # bloc de variables uniquement


[gcode_macro NOZZLE_CLEAN]
description: Deploie la brosse, essuie la buse, retracte
gcode:
    {% set c      = printer["gcode_macro _WIPER_CONF"] %}
    {% set passes = params.PASSES|default(c.passes)|int %}
    {% set temp   = params.TEMP|default(c.temp)|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing avant nettoyage...
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=nozzle_clean
    M117 Nettoyage buse...
    G90

    # Descendre le plateau. Sur une VCore le portique est fixe en Z : ce G1 Z
    # ecarte le PLATEAU, il ne leve pas la buse. La condition garantit qu'on
    # ne REMONTE jamais le plateau — en pleine impression, ce serait la piece
    # qui viendrait percuter la tete.
    {% if printer.toolhead.position.z|float < c.z_safe|float %}
        G1 Z{c.z_safe} F1500
    {% endif %}

    # Se ranger a l'ecart AVANT de deployer : la brosse sort a l'horizontale
    # et traverse une zone du plan XY.
    G1 X{c.x_safe} Y{c.y_safe} F12000

    # Chauffe pendant le trajet : assez chaud pour ramollir le residu, assez
    # froid pour qu'il ne coule pas.
    M104 S{temp}
    SET_SERVO SERVO=servo_wiper ANGLE={c.angle_deploy}
    G4 P600                      # laisse au servo le temps d'arriver
    G1 X{c.x_wipe} Y{c.y_min} F10000
    M109 S{temp}

    {% for i in range(passes) %}
        G1 Y{c.y_max} F{c.speed}
        G1 Y{c.y_min} F{c.speed}
    {% endfor %}

    # Revenir au point de degagement AVANT de retracter : la brosse rentre
    # par le meme arc qu'a l'aller.
    G1 X{c.x_safe} Y{c.y_safe} F12000
    SET_SERVO SERVO=servo_wiper ANGLE={c.angle_park}
    G4 P600

    G92 E0
    M117 Buse propre
    RESTORE_GCODE_STATE NAME=nozzle_clean


# Securite au demarrage : si Klipper a redemarre brosse deployee, elle se
# retracte toute seule avant le premier deplacement.
[delayed_gcode _WIPER_PARK_AU_DEMARRAGE]
initial_duration: 2
gcode:
    SET_SERVO SERVO=servo_wiper ANGLE={printer["gcode_macro _WIPER_CONF"].angle_park}


[gcode_macro WIPER_DEPLOY]
description: Deploie la brosse (reglage et mesures)
gcode:
    SET_SERVO SERVO=servo_wiper ANGLE={printer["gcode_macro _WIPER_CONF"].angle_deploy}

[gcode_macro WIPER_PARK]
description: Retracte la brosse
gcode:
    SET_SERVO SERVO=servo_wiper ANGLE={printer["gcode_macro _WIPER_CONF"].angle_park}


# ═══════════════════════════════════════════════════════════════════════════
#  INTEGRATION DANS START_PRINT
#
#  Dans printer.cfg, juste APRES la chauffe de la buse et AVANT la ligne de
#  purge :
#
#      STATUS_HEATING_NOZZLE
#      M109 S{HOTEND}
#      NOZZLE_CLEAN                 <-- ici
#      G1 Z5 F600
#      ...
#
#  ⚠️ Pas dans END_PRINT avec TURN_OFF_HEATERS avant : la buse froide ne
#     s'essuie pas, le residu durci raye la brosse sans partir.
# ═══════════════════════════════════════════════════════════════════════════
