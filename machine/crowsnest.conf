# ═══════════════════════════════════════════════════════════════════════════
#  CROWSNEST — webcam de la RatRig V-Core 3.1
#
#  Emplacement sur la machine : ~/printer_data/config/crowsnest.conf
#  Appliquer : sudo systemctl restart crowsnest
#
#  Matériel relevé dans le log :
#    Raspberry Pi 4 Model B · Raspbian 11 · crowsnest v4.1.17
#    Logitech 046d:081b (C310) sur /dev/video0
#    MJPG natif jusqu'à 1280x720 @ 30 fps
#
#  ⚠️ MODE : ustreamer (MJPEG), PAS camera-streamer (WebRTC).
#     Le WebRTC a été essayé et n'a pas tenu — le flux s'arrêtait. Et pour
#     Home Assistant c'est de toute façon le mauvais choix : HA ne consomme
#     pas de WebRTC dans une carte picture-entity sans go2rtc et une carte
#     custom HACS. Ne pas y revenir.
#
#     C'est la SEULE ligne qui change par rapport à la version precedente de
#     ce fichier. Le retour en MJPEG a ete fait en reprenant un fichier plus
#     ancien, ce qui a aussi fait perdre le chemin by-id et le 1280x720 :
#     ils sont retablis ici.
# ═══════════════════════════════════════════════════════════════════════════

[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: quiet                        # Valid Options are quiet/verbose/debug
delete_log: true                        # Deletes log on every restart, if set to true
no_proxy: false

[cam 1]
mode: ustreamer
enable_rtsp: false
rtsp_port: 8554
port: 8080

# Chemin stable par identifiant USB. /dev/video0 peut changer de numero si un
# autre peripherique video est branche, ou selon l'ordre d'enumeration au boot.
device: /dev/v4l/by-id/usb-046d_081b_5D513790-video-index0

# Etait 640x480. La C310 fournit du MJPG 1280x720 en materiel : le Pi ne fait
# que relayer, il ne reencode rien, donc la montee en resolution ne lui coute
# quasiment rien — et une premiere couche devient lisible.
resolution: 1280x720
max_fps: 15

#  --format=MJPEG        force le JPEG materiel de la camera. Sans ca ustreamer
#                        peut choisir le YUYV et compresser en logiciel : c'est
#                        la que le CPU du Pi s'ecroule.
#  --drop-same-frames=30  n'envoie pas les images identiques (imprimante a
#                        l'arret, vue figee) : bande passante quasi nulle au
#                        repos, sans rien changer quand ca bouge.
custom_flags: --format=MJPEG --drop-same-frames=30


# ═══════════════════════════════════════════════════════════════════════════
#  CÔTÉ MAINSAIL — Réglages interface → Caméras
#
#    Nom             : RatRig
#    Service         : Mjpegstreamer Adaptive     ⭐ PAS « WebRTC (camera-streamer) »
#    Flux d'URL      : /webcam/?action=stream
#    Aperçu de l'URL : /webcam/?action=snapshot
#
#  Un « Connecting » noir et perpétuel dans Mainsail = ce champ Service est
#  resté sur WebRTC alors que crowsnest sert du MJPEG. C'est le seul symptôme
#  de cette incohérence, et il ne produit aucune erreur dans le log.
#
#  « Adaptive » demande les images au rythme que le navigateur suit vraiment,
#  au lieu d'avaler un flux continu — ça compte sur une tablette laissée
#  ouverte des heures. Si l'image saccade, repasser sur « Mjpegstreamer ».
# ═══════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════
#  CÔTÉ HOME ASSISTANT — dans configuration.yaml
#
#      camera:
#        - platform: mjpeg
#          name: RatRig Webcam
#          mjpeg_url: http://192.168.1.41/webcam/?action=stream
#          still_image_url: http://192.168.1.41/webcam/?action=snapshot
#
#  L'intégration Moonraker ne crée aucune entité du domaine camera : il faut
#  la déclarer à la main. Le nom « RatRig Webcam » produit camera.ratrig_webcam,
#  l'entité qu'attend la carte de machine/homeassistant-ratrig.yaml.
# ═══════════════════════════════════════════════════════════════════════════
