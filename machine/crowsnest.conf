# ═══════════════════════════════════════════════════════════════════════════
#  CROWSNEST — webcam de la RatRig V-Core 3.1
#
#  Emplacement sur la machine : ~/printer_data/config/crowsnest.conf
#  Appliquer : sudo systemctl restart crowsnest
#
#  Matériel relevé dans le log :
#    Raspberry Pi 4 Model B · Raspbian 11 · crowsnest v4.1.17
#    Logitech 046d:081b (C310) sur /dev/video0
#    MJPG natif jusqu'à 1280x720 @ 30 fps
#
#  ── MODE : camera-streamer ───────────────────────────────────────────────
#  Il sert le WebRTC **et** le MJPEG en même temps. Il n'y a pas de choix à
#  faire entre les deux :
#
#    /webcam/webrtc             → WebRTC, pour Mainsail (fluide, faible latence)
#    /webcam/?action=stream     → MJPEG, pour Home Assistant
#    /webcam/?action=snapshot   → image fixe, pour HA et pour n8n
#
#  Mainsail prend le WebRTC, Home Assistant prend le MJPEG, chacun est servi
#  par le même processus.
# ═══════════════════════════════════════════════════════════════════════════

[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: quiet                        # Valid Options are quiet/verbose/debug
delete_log: true                        # Deletes log on every restart, if set to true
no_proxy: false

[cam 1]
mode: camera-streamer
enable_rtsp: false
rtsp_port: 8554
port: 8080

# Chemin stable par identifiant USB. /dev/video0 peut changer de numero si un
# autre peripherique video est branche, ou selon l'ordre d'enumeration au boot.
device: /dev/v4l/by-id/usb-046d_081b_5D513790-video-index0

resolution: 1280x720

# 15 au lieu de 30 — c'est le seul changement par rapport a la config d'hier,
# et c'est la piste la plus probable pour expliquer l'arret du flux.
#
# En WebRTC, camera-streamer ne relaie pas le JPEG de la camera : il le decode
# puis le REENCODE en H264 pour chaque client. A 720p30 sur un Pi 4, ce
# transcodage permanent sature l'encodeur materiel ; quand il decroche, le flux
# s'arrete sans forcement laisser d'erreur dans le log de crowsnest.
# A 15 fps la charge est divisee par deux, et sur une impression qui avance a
# quelques millimetres par seconde la difference est invisible a l'oeil.
max_fps: 15

custom_flags:
v4l2ctl:


# ═══════════════════════════════════════════════════════════════════════════
#  SI LE FLUX S'ARRÊTE À NOUVEAU
#
#  Dans l'ordre, du plus probable au moins probable :
#
#  1. Redescendre encore : max_fps: 10, ou resolution: 640x480 @ 15.
#     Si ça tient, c'est confirmé que c'est la charge de transcodage.
#
#  2. Regarder la charge pendant que le flux tourne :
#         top -b -n1 | head -15
#     Si camera-streamer est proche de 100 % d'un cœur, c'est lui.
#
#  3. Regarder ce que dit camera-streamer lui-même — crowsnest.log ne montre
#     que son démarrage, pas sa mort :
#         journalctl -u crowsnest -n 100 --no-pager
#
#  4. Vérifier l'alimentation du Pi. Une C310 en transcodage tire du courant ;
#     un sous-voltage coupe l'USB sans prévenir :
#         vcgencmd get_throttled
#     Autre chose que 0x0 = alimentation insuffisante ou surchauffe.
#
#  En dernier recours, mode: ustreamer redonne du MJPEG pur : pas de
#  transcodage du tout, le Pi ne fait que relayer le JPEG de la camera. Moins
#  fluide, mais increvable.
# ═══════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════
#  CÔTÉ MAINSAIL — Réglages interface → Caméras
#
#    Nom             : RatRig
#    Service         : WebRTC (camera-streamer)
#    Flux d'URL      : /webcam/?action=stream
#    Aperçu de l'URL : /webcam/?action=snapshot
#
#  ⚠️ Ce champ Service doit correspondre au `mode` ci-dessus. Un « Connecting »
#     noir et perpétuel dans Mainsail = les deux ne concordent pas. Ça ne
#     produit aucune erreur dans le log : c'est le seul symptôme.
#       mode: camera-streamer  →  Service : WebRTC (camera-streamer)
#       mode: ustreamer        →  Service : Mjpegstreamer Adaptive
# ═══════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════
#  CÔTÉ HOME ASSISTANT — dans configuration.yaml
#
#      camera:
#        - platform: mjpeg
#          name: RatRig Webcam
#          mjpeg_url: http://192.168.1.41/webcam/?action=stream
#          still_image_url: http://192.168.1.41/webcam/?action=snapshot
#
#  L'intégration Moonraker ne crée aucune entité du domaine camera : il faut
#  la déclarer à la main. Le nom « RatRig Webcam » produit camera.ratrig_webcam,
#  l'entité qu'attend la carte de machine/homeassistant-ratrig.yaml.
#
#  Ces URL restent servies en mode camera-streamer — HA n'a pas besoin de
#  comprendre le WebRTC, il lit le MJPEG que le même processus publie.
# ═══════════════════════════════════════════════════════════════════════════
