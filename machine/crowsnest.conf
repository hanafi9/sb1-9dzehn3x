#### crowsnest.conf
#### This is a typical default config.
#### Also used as default in mainsail / MainsailOS
#### See:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md
#### for details to configure to your needs.


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. To use any other port would involve      #####
####    changing the proxy configuration or using directly      #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################

#####################################################################
####  RATRIG V-CORE 3.1 400x400 — Logitech C310 (046d:081b)
####
####  mode camera-streamer sert le WebRTC ET le MJPEG en parallele :
####    /webcam/webrtc            -> Mainsail   (Service : WebRTC (camera-streamer))
####    /webcam/?action=stream    -> Home Assistant (plateforme mjpeg)
####    /webcam/?action=snapshot  -> image fixe, HA et n8n
####
####  Le champ Service de Mainsail DOIT concorder avec le mode ci-dessous.
####  S'ils divergent : image noire, « Connecting » perpetuel, et aucune
####  erreur nulle part. C'est le seul symptome.
#####################################################################


[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: quiet                        # Valid Options are quiet/verbose/debug
delete_log: true                        # Deletes log on every restart, if set to true
no_proxy: false

[cam 1]
mode: camera-streamer
enable_rtsp: false                      # Personne ne lit le RTSP ici. L'activer
                                        #   ajoute un second encodage H264 en
                                        #   permanence, pour rien.
rtsp_port: 8554
port: 8080

#  ⚠️ index0, PAS index1.
#  Une webcam UVC expose deux noeuds : index0 = le flux d'images, index1 = les
#  metadonnees (horodatages, donnees capteur). Sur index1, camera-streamer
#  ouvre un peripherique parfaitement valide dont il ne sortira jamais une
#  seule image — le WebRTC reste en negociation eternelle, sans erreur.
#  crowsnest lui-meme annonce le bon noeud dans son log :
#      /dev/v4l/by-id/usb-046d_081b_5D513790-video-index0 -> /dev/video0
device: /dev/v4l/by-id/usb-046d_081b_5D513790-video-index0

resolution: 1280x720

#  En WebRTC, camera-streamer decode le JPEG de la camera puis le REENCODE en
#  H264 pour chaque client. A 720p30 sur un Pi 4 l'encodeur materiel sature et
#  le flux decroche, sans trace dans le log. 10 fps laisse une marge large et
#  reste fluide pour surveiller une buse.
max_fps: 10

custom_flags:
v4l2ctl:                                # Parametres v4l2-ctl eventuels.
                                        #   ⚠️ Uniquement des reglages de camera
                                        #   (brightness=, contrast=...). Ce n'est
                                        #   PAS un endroit pour des commandes
                                        #   shell : « vcgencmd get_throttled » se
                                        #   tape dans un terminal.


#####################################################################
####  SI LE FLUX RETOMBE
####
####  1. Verifier que la camera sort bien des images, hors crowsnest :
####       v4l2-ctl --device=/dev/video0 --all | head -20
####
####  2. Charge pendant que le flux tourne :
####       top -b -n1 | head -15
####     camera-streamer proche de 100 % d'un coeur = transcodage sature,
####     redescendre max_fps ou passer en 640x480.
####
####  3. Ce que dit camera-streamer lui-meme (crowsnest.log ne montre que
####     son demarrage, pas sa mort) :
####       journalctl -u crowsnest -n 100 --no-pager
####
####  4. Alimentation du Pi. Un sous-voltage coupe l'USB sans prevenir :
####       vcgencmd get_throttled
####     Autre chose que 0x0 = alimentation insuffisante ou surchauffe.
####
####  En dernier recours, mode: ustreamer donne du MJPEG pur : aucun
####  transcodage, le Pi ne fait que relayer. Moins fluide, increvable.
####  Penser alors a basculer le Service de Mainsail sur
####  « Mjpegstreamer Adaptive ».
#####################################################################


#####################################################################
####  COTE HOME ASSISTANT — dans configuration.yaml
####
####      camera:
####        - platform: mjpeg
####          name: RatRig Webcam
####          mjpeg_url: http://192.168.1.41/webcam/?action=stream
####          still_image_url: http://192.168.1.41/webcam/?action=snapshot
####
####  L'entite camera.ratrig_cam1 creee par l'integration Moonraker pointe
####  sur une URL RELATIVE (/webcam/...) : elle marche depuis Mainsail, ou le
####  navigateur complete avec l'IP de l'imprimante, mais pas depuis Home
####  Assistant, ou il n'y a rien a completer. D'ou l'image cassee.
####  Le bloc ci-dessus donne l'URL complete et cree camera.ratrig_webcam,
####  l'entite qu'attend machine/homeassistant-ratrig.yaml.
#####################################################################
