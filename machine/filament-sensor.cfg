#############################################################################################################
### BIGTREETECH SMART FILAMENT SENSOR V1.0 — sur l'Octopus
###
### Capteur combiné : détecte la FIN de filament ET l'ABSENCE DE MOUVEMENT
### (bourrage / extrudeur qui patine). C'est un capteur de MOUVEMENT : il
### déclenche si l'extrudeur pousse « detection_length » mm sans que la roue
### du capteur ne tourne.
###
### CÂBLAGE (Octopus) — connecteur dédié « SENSOR » (VS / GND / PB7) :
###     - VS  → 5V (alimente le SFS)
###     - GND → GND
###     - PB7 → Signal
###
### ═══════════════════════════════════════════════════════════════════════
### ÉTAT 2026-09-03 — CAPTEUR HORS SERVICE, PAUSE DÉSACTIVÉE
###
### QUERY_FILAMENT_SENSOR SENSOR=SFS répond « filament not detected » en
### permanence, filament chargé ou non : Klipper ne reçoit AUCUNE impulsion
### du capteur. Câblage ou alimentation à vérifier (voir plus bas).
###
### ⚠️ PIÈGE KLIPPER : un capteur de filament est ACTIF PAR DÉFAUT dès le
###    démarrage. Commenter « SET_FILAMENT_SENSOR ... ENABLE=1 » dans
###    START_PRINT ne le désactive donc PAS — il continuait de déclencher
###    PAUSE dès les premières extrusions (juste après la ligne de purge).
###    C'est « pause_on_runout » ci-dessous qui commande vraiment.
###
### DIAGNOSTIC À FAIRE : tourner la roue du SFS à la main et regarder sa LED
###    - LED clignote  → capteur alimenté, c'est le fil SIGNAL (PB7) qui ne passe pas
###    - LED éteinte   → capteur non alimenté, cavalier VS du port à mettre sur 5V
###
### QUAND LE CAPTEUR SERA RÉPARÉ : remettre pause_on_runout: True et
### remettre PAUSE dans runout_gcode.
#############################################################################################################

[filament_motion_sensor SFS]
switch_pin: ^!PB7
detection_length: 7.0            # mm d'extrusion sans mouvement avant alarme (V1.0 : ~7 mm)
extruder: extruder
pause_on_runout: False           # 2026-09-03 : était True → mettait l'impression en pause
                                 #   juste après la ligne de purge, capteur muet.
runout_gcode: M117 SFS muet (capteur a reparer) - impression continue
insert_gcode: M117 Filament détecté

# Activer / désactiver à la volée (ex : couper pendant un chargement manuel)
[gcode_macro SFS_ENABLE]
gcode:
    SET_FILAMENT_SENSOR SENSOR=SFS ENABLE=1

[gcode_macro SFS_DISABLE]
gcode:
    SET_FILAMENT_SENSOR SENSOR=SFS ENABLE=0
