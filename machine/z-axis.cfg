# ════════════════════════════════════════════════════════════════════════
#  Axe Z — VCore 3.1 400×400 · BTT Octopus Pro v1.1 (STM32F446)
#
#  Bloc de SURCHARGE. À coller dans printer.cfg APRÈS tous les [include],
#  jamais avant : RatOS définit les steppers dans ses bricks, et seule la
#  dernière définition d'une clé est appliquée par Klipper.
#
#  ⚠️ Ne rien appliquer tant que les trois vis ne tournent pas.
#     Aucun mouvement Z coordonné (G28 Z, Z_TILT_ADJUST) avant mise à
#     niveau manuelle du plateau — sinon on force sur le cadre.
# ════════════════════════════════════════════════════════════════════════


# ── Rappel : brochage des slots moteur (Octopus Pro v1.1 / F446) ────────
#
#   Slot    step    dir     enable   uart
#   MOTOR0  PF13    PF12    PF14     PC4
#   MOTOR1  PG0     PG1     PF15     PD11
#   MOTOR2  PF11    PG3     PG5      PC6
#   MOTOR3  PG4     PC1     PA0      PC7
#   MOTOR4  PF9     PF10    PG2      PF2
#   MOTOR5  PC13    PF0     PF1      PE4
#
#   Les enable_pin sont inversés (`!`) sur cette carte. Les dir_pin, non :
#   leur polarité dépend du sens de câblage du moteur, pas de la carte.


# ── 1. Sens de rotation ─────────────────────────────────────────────────
#
#   État constaté : FORCE_MOVE avec DISTANCE positif fait MONTER le
#   plateau. Sur une VCore 3 le plateau est la pièce mobile en Z, et la
#   convention Klipper veut que Z croissant ÉLOIGNE la buse du plateau —
#   donc que le plateau DESCENDE. Les trois sens sont à inverser.
#
#   Inversion = ajouter ou retirer le `!` devant dir_pin. Vérifier vis par
#   vis avec FORCE_MOVE avant de toucher au reste : un seul sens faux et
#   Z_TILT_ADJUST tord le plateau au lieu de le mettre à plat.

[stepper_z]
dir_pin: !PG3

[stepper_z1]
dir_pin: !PC1

[stepper_z2]
dir_pin: !PF10


# ── 2. Repli si le slot MOTOR4 est confirmé mort ────────────────────────
#
#   MOTOR5, 6 et 7 sont libres. Décommenter ce bloc déplace stepper_z2 sur
#   MOTOR5 et rend les deux surcharges dir_pin/PF10 ci-dessus caduques
#   (supprimer la section [stepper_z2] du point 1 dans ce cas).
#
#   Le `!` sur dir_pin est à confirmer par FORCE_MOVE après le déplacement,
#   pas à recopier à l'aveugle : rien ne garantit que PF0 ait la même
#   polarité au repos que PF10.
#
# [stepper_z2]
# step_pin: PC13
# dir_pin: PF0
# enable_pin: !PF1
#
# [tmc2209 stepper_z2]
# uart_pin: PE4


# ── 3. z_tilt ───────────────────────────────────────────────────────────
#
#   Cette configuration est AUTONOME : il n'y a pas de dossier RatOS/ dans
#   printer_data/config, aucun [include], donc rien dont hériter. [z_tilt]
#   est réellement absent et doit être écrit.
#
#   Coordonnées reprises telles quelles de la source officielle, encore
#   présente sur la machine :
#     .RatOS_repo_backup/printers/v-core-3/400.cfg
#
#   RatOS y documente son propre ordre de câblage :
#     « the Z-steppers are called Z1 / Left Z, Z2 / Rear Z, Z3 / Right Z,
#       here they're mapped to z, z1, z2 respectively »
#   soit stepper_z = gauche (0,0), z1 = arrière (200,400), z2 = droite (400,0).
#
#   Le câblage de cette machine diffère, donc les mêmes coordonnées sont
#   réordonnées — la Nème ligne décrit la vis entraînée par le Nème stepper.

[z_tilt]
z_positions:
    200,400    # stepper_z  → moteur ARRIÈRE
    0,0        # stepper_z1 → moteur AVANT-GAUCHE
    400,0      # stepper_z2 → moteur AVANT-DROIT
points:
    60,60
    235,370
    360,60
horizontal_move_z: 20
retries: 10
retry_tolerance: 0.02

#   `points` sont des coordonnées de BUSE, pas de sonde, et ne dépendent
#   pas de l'ordre des steppers. Avec l'offset Y du Cartographer (≈ +21),
#   le point 235,370 fait mesurer la sonde à y≈391 : à vérifier qu'elle
#   reste sur le plateau.


# ── 3 bis. Limites de vitesse — cause du bruit sur les cinq moteurs ─────
#
#   Constaté dans printer.cfg : max_accel 10000 et surtout max_z_accel 300.
#   Références RatOS pour cette machine :
#
#     profil basic       : max_accel 1500,  max_z_accel 30
#     profil performance : max_accel 15000, max_z_accel 150
#                          « DO NOT ENABLE THIS WITHOUT ACTIVELY COOLED
#                            STEPPER DRIVERS. »
#
#   max_z_accel 300 est le double du profil le plus agressif de RatOS, et
#   dix fois le profil prudent — sur un axe Z à vis, qui déplace tout le
#   plateau. C'est ce qui fait grogner les moteurs au démarrage de chaque
#   mouvement.
#
#   minimum_cruise_ratio est absent alors que les deux profils RatOS le
#   fixent explicitement.

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 30
square_corner_velocity: 5


# ── 3 ter. Manques relevés par rapport à steppers.cfg de RatOS ──────────

[stepper_z]
position_min: -5     # requis par la calibration d'offset Z et z_tilt
homing_speed: 10


# ── 4. Ventilateur de carte ─────────────────────────────────────────────
#
#   Le ventilateur branché sur CNC FAN2 ne tournait pas : aucune section
#   ne le pilotait. En [controller_fan] il démarre dès qu'un driver est
#   sous tension et s'arrête après le délai d'inactivité.

[controller_fan board_fan]
pin: PD12
kick_start_time: 0.5
fan_speed: 1.0
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
