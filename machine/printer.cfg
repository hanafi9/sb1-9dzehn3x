[include mainsail.cfg]
# Klipper Configuration - V-Core 3 400x400mm
# Hardware: CAN Bus + BTT EBB42 v1.1 + Cartographer
#
# Corrections appliquées, référencées sur .RatOS_repo_backup/printers/v-core-3/
# Les lignes modifiées portent un commentaire « CORRIGÉ ».
#
# ⚠️ AVERTISSEMENT — stepper_z2 ne tourne toujours pas au moment où ce
#    fichier est écrit. Tant que les TROIS vis ne montent pas, ne lance
#    ni G28 Z, ni Z_TILT_ADJUST, ni START_PRINT : le plateau serait forcé
#    en biais sur deux vis contre une immobile.

#############################################################################################################
### PRINTER CONFIGURATION
#############################################################################################################

[printer]
kinematics: corexy
max_velocity: 300                # CORRIGÉ — était 500
max_accel: 3000                  # CORRIGÉ — était 10000 (profil performance RatOS = 15000,
                                 #           interdit sans refroidissement actif des drivers)
minimum_cruise_ratio: 0.5        # CORRIGÉ — absent ; RatOS le fixe dans ses deux profils
max_z_velocity: 15
max_z_accel: 30                  # CORRIGÉ — était 300, soit 2× le profil performance (150)
                                 #           et 10× le profil basic (30). Cause du grognement
                                 #           des moteurs Z au départ de chaque mouvement.
square_corner_velocity: 5.0

#############################################################################################################
### CANBUS U2C ADAPTER
#############################################################################################################
# Le U2C est un pont USB↔CAN : il crée l'interface can0, il ne pilote rien.
# Le déclarer en [mcu] ajoute un nœud qui doit répondre au démarrage, pour rien.

#[mcu u2c]
#canbus_uuid: 6092d36469e1

#############################################################################################################
### CONTROL BOARD - MAIN MCU
#############################################################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_260035000251313133353932-if00
restart_method: command

#############################################################################################################
### TOOLHEAD - BTT EBB42 v1.1
#############################################################################################################

[mcu toolhead]
canbus_interface: can0
canbus_uuid: e3be9642b024

#############################################################################################################
### STEPPER MOTORS
#############################################################################################################
# Câblage réel de cette machine (l'extrudeur étant sur l'EBB42, MOTOR2 est
# libre et les trois Z sont décalés d'un cran par rapport au plan RatOS) :
#   MOTOR0 = X   MOTOR1 = Y
#   MOTOR2 = stepper_z   → vis ARRIÈRE
#   MOTOR3 = stepper_z1  → vis AVANT-GAUCHE
#   MOTOR5 = stepper_z2  → vis AVANT-DROITE   (MOTOR4 abandonné)

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
endstop_pin: ^toolhead:PB6
position_endstop: 0
position_max: 400
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.9                 # CORRIGÉ — était 1.2, le plafond continu d'un TMC2209
                                 #           avec shunts 0,110 Ω. À remplacer par la valeur
                                 #           de .RatOS_repo_backup/printers/v-core-3/v-core-3.cfg
sense_resistor: 0.110
stealthchop_threshold: 0
                                 # CORRIGÉ — diag_pin et driver_SGTHRS retirés : résidus de
                                 #           l'époque sensorless, l'endstop X est le contact
                                 #           physique sur l'EBB42.

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: ^!PG9
position_endstop: 400
position_max: 400
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.9                 # CORRIGÉ — était 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z : vis ARRIÈRE ────────────────────────────────────────────────────
[stepper_z]
homing_retract_dist: 0
step_pin: PF11
dir_pin: !PG3                    # CORRIGÉ — inversé : un DISTANCE positif doit FAIRE
                                 #           DESCENDRE le plateau (convention Klipper)
enable_pin: !PG5
microsteps: 64
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -5
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z1 : vis AVANT-GAUCHE, sur MOTOR6 ──────────────────────────────────
# Déplacé de MOTOR3 (PG4/PC1/PA0, uart PC7) vers MOTOR6 : MOTOR3 ne
# délivrait aucun courant (moteur libre à la main), prouvé côté carte par
# échange des câbles. MOTOR6 est un slot neuf, jamais utilisé.
[stepper_z1]
step_pin: PE2
dir_pin: !PE3                    # ! provisoire — sens à confirmer par FORCE_MOVE
enable_pin: !PD4
microsteps: 64
rotation_distance: 4

[tmc2209 stepper_z1]
uart_pin: PE1
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z2 : vis AVANT-DROITE, sur MOTOR7 ──────────────────────────────────
# Déplacé de MOTOR5 (PC13/PF0/PF1, uart PE4) vers MOTOR7 : MOTOR5 alimentait
# le moteur mais ne le faisait pas tourner. MOTOR7 est un slot neuf.
# (MOTOR4 avait déjà été abandonné auparavant.)
[stepper_z2]
step_pin: PE6
dir_pin: !PA14                   # ! provisoire — sens à confirmer par FORCE_MOVE
enable_pin: !PE0
microsteps: 64
rotation_distance: 4

[tmc2209 stepper_z2]
uart_pin: PD3
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#############################################################################################################
### Z TILT — mise à plat du plateau sur les trois vis
#############################################################################################################
# Coordonnées reprises de .RatOS_repo_backup/printers/v-core-3/400.cfg.
# RatOS y documente son propre ordre : stepper_z = gauche (0,0),
# z1 = arrière (200,400), z2 = droite (400,0). Le câblage de cette machine
# étant différent, les mêmes coordonnées sont réordonnées : la Nème ligne
# décrit la vis entraînée par le Nème stepper.
#
# ⚠️ NE PAS lancer Z_TILT_ADJUST avant que les trois vis tournent ET que le
#    plateau soit mis à plat à la main.

[z_tilt]
z_positions:
    200,400                      # stepper_z  → moteur ARRIÈRE
    0,0                          # stepper_z1 → moteur AVANT-GAUCHE
    400,0                        # stepper_z2 → moteur AVANT-DROITE
points:
    60,60
    235,350                      # RatOS dit 235,370 ; ramené à 350 car l'offset Y du
                                 # Cartographer (+21,1) y placerait la sonde à y=391,
                                 # en surplomb du bord du plateau
    360,60
horizontal_move_z: 20
speed: 300                       # vitesse de déplacement entre les points (mm/s)
retries: 10
retry_tolerance: 0.02

#############################################################################################################
### HEATER BED
#############################################################################################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 120

#############################################################################################################
### TEMPERATURE SENSORS
#############################################################################################################

[temperature_sensor MainBoard]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead]
sensor_type: temperature_mcu
sensor_mcu: toolhead
min_temp: 0
max_temp: 100

#[temperature_sensor Chamber]
#sensor_type: Generic 3950
#sensor_pin: PF4
#min_temp: 0
#max_temp: 100
#gcode_id: chamber

#############################################################################################################
### CARTOGRAPHER PROBE
#############################################################################################################

# Module scanner.py (et non l'ancien cartographer.py) : c'est le module
# maintenu, écrit pour la nouvelle API « probe session » de Klipper (résultats
# avec .bed_z). cartographer.py renvoyait des listes et plantait au premier
# G28 Z / Z_TILT_ADJUST sur ce Klipper récent. Voir DEPANNAGE panne 7.
# Gabarit officiel : cartographer-klipper/scripts/setup.py.

[mcu scanner]
canbus_uuid: 4973681e12df

[scanner]
mcu: scanner
x_offset: 0
y_offset: 21.1
backlash_comp: 0.5
sensor: cartographer
sensor_alt: carto
mesh_runs: 2

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

#############################################################################################################
### EXTRUDER (EBB42)
#############################################################################################################

[extruder]
step_pin: toolhead:PD0
dir_pin: toolhead:PD1
enable_pin: !toolhead:PD2
microsteps: 16
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead:PB13
sensor_type: PT1000
sensor_pin: toolhead:PA3
# Si la température de buse est décalée au repos, c'est le pullup : l'EBB42
# commute une résistance de précision par cavalier ou DIP. Déclarer alors
# pullup_resistor: <valeur du montage> (Klipper suppose 4700 par défaut).
min_temp: 0
max_temp: 300
max_extrude_only_distance: 500
max_extrude_cross_section: 5
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: toolhead:PA15
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 0

#############################################################################################################
### HOTEND FAN & PART COOLING
#############################################################################################################

[heater_fan hotend_fan]
pin: toolhead:PA1
heater: extruder
heater_temp: 50.0

[fan]
pin: toolhead:PA0

#############################################################################################################
### VENTILATEUR DE CARTE
#############################################################################################################
# CNC FAN2. Sans cette section le ventilateur ne démarrait jamais, alors que
# RatOS conditionne tout profil d'accélération élevé à un refroidissement
# actif des drivers.

[controller_fan board_fan]
pin: PD12
kick_start_time: 0.5             # CORRIGÉ — ajouté : démarrage franc du ventilateur
fan_speed: 1.0
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
heater: heater_bed

#############################################################################################################
### ADXL345 ACCELEROMETER
#############################################################################################################

[adxl345]
cs_pin: toolhead:PB12
spi_software_sclk_pin: toolhead:PB10
spi_software_mosi_pin: toolhead:PB11
spi_software_miso_pin: toolhead:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points: 200, 200, 20

#############################################################################################################
### BED MESH
#############################################################################################################

[bed_mesh]
zero_reference_position: 205, 200   # centre du PEI, mesuré
speed: 300
horizontal_move_z: 2                 # DOIT rester dans la plage calibrée du coil (model_range 0.1–5 mm).
                                     #   À 5 mm le coil sort de sa plage sur les zones basses du plateau
                                     #   → Z aberrants (mesh min/max à des milliers) + « Mesh extends
                                     #   outside of the fade range ». 2 mm = marge des deux côtés.
mesh_min: 55, 55                 # Coins du PEI mesurés à la buse : avant-gauche (32,33),
mesh_max: 355, 350               #   arrière-droit (380,371). Marge de ~18 mm à l'intérieur
                                 #   pour que la sonde ne palpe pas le biseau du bord de PEI
                                 #   (sinon creux artificiel au coin, cf. Min à -0,8 mm).
probe_count: 15, 15              # 225 points, suffisant et bien plus rapide que 25×25
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

#############################################################################################################
### HOMING
#############################################################################################################

[safe_z_home]
home_xy_position: 200, 200
speed: 100
z_hop: 10
z_hop_speed: 15

[force_move]
enable_force_move: True

# Requis pour le bed mesh ADAPTATIF (BED_MESH_CALIBRATE ADAPTIVE=1) : Klipper lit
# les objets définis par le slicer (« Label objects » dans OrcaSlicer) et ne palpe
# que leur emprise. Active aussi l'annulation d'objet dans Mainsail.
[exclude_object]

#############################################################################################################
### CHAMBER & LED CONTROL
#############################################################################################################

[fan_generic chamber_fan]
pin: PA8
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5

[gcode_macro CHAMBER_FAN_ON]
gcode:
    {% set speed = params.SPEED|default(1.0)|float %}
    SET_FAN_SPEED FAN=chamber_fan SPEED={speed}

[gcode_macro CHAMBER_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0

[output_pin cob_led]
pin: PB10
pwm: true
cycle_time: 0.01
value: 0
shutdown_value: 0

[neopixel chamber_leds]
pin: PB0
chain_count: 24
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[gcode_macro LED_ON]
gcode:
    SET_LED LED=chamber_leds RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LED_OFF]
gcode:
    SET_LED LED=chamber_leds RED=0 GREEN=0 BLUE=0

[gcode_macro LED_DIM]
gcode:
    SET_LED LED=chamber_leds RED=0.2 GREEN=0.2 BLUE=0.2

#############################################################################################################
### MACROS D'IMPRESSION
### Adaptées de la config d'un ami (VCore 3 300). Simplifiées pour ce matériel :
### pas de caisson régulé ni de système de LED par états — on utilise LED_ON/LED_DIM
### et un heat-soak par temporisation simple (sans sonde de chambre).
#############################################################################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
    CLEAR_PAUSE
    G90
    M83
    LED_ON
    M117 Chauffe plateau {BED|int}C...
    # Préchauffe buse à 150 °C : assez chaud pour ne pas gêner, trop froid pour couler
    M104 S150
    M140 S{BED}
    M190 S{BED}
    # Heat-soak : laisse le plateau et le cadre se stabiliser. Durée selon le filament.
    {% if BED >= 100 %}
        M117 Soak 8 min (ABS/ASA)...
        G4 P480000
    {% elif BED >= 70 %}
        M117 Soak 4 min (PETG)...
        G4 P240000
    {% else %}
        M117 Soak 2 min (PLA)...
        G4 P120000
    {% endif %}
    M117 Homing...
    G28
    M117 Nivellement Z-Tilt...
    Z_TILT_ADJUST
    G28 Z
    M117 Maillage adaptatif...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    # Chauffe finale de la buse, tête au parking (anti-ooze sur la pièce)
    PARK_HOTEND
    M117 Chauffe buse {HOTEND|int}C...
    M109 S{HOTEND}
    M117 Purge...
    PRIME_LINE
    M117 Impression...

[gcode_macro END_PRINT]
gcode:
    M400
    M140 S0
    M104 S0
    M106 S0
    G91
    G1 E-2 F1800                 # petite rétraction pour éviter le fil qui bave
    G1 Z10 F3000
    G90
    PARK_HOTEND
    LED_DIM
    M117 Impression terminée
    M84

[gcode_macro PARK_HOTEND]
description: Dégage la tête en hauteur puis centre-arrière
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_final = [[act_z + 20, 50]|max, max_z]|min %}
    G90
    G1 Z{z_final} F3000
    G1 X{max_x / 2} Y{max_y - 5} F6000

[gcode_macro PRIME_LINE]
description: Ligne de purge sur le bord avant-gauche du PEI
gcode:
    SAVE_GCODE_STATE NAME=prime_line
    G90
    M83
    G1 Z5 F600
    G1 X40 Y45 F6000             # coin avant-gauche du PEI (mesuré 32,33)
    G1 Z0.3 F600
    G92 E0
    G1 X240 Y45 E15 F1200        # trait de purge de 200 mm
    G1 Z2 F600
    RESTORE_GCODE_STATE NAME=prime_line

