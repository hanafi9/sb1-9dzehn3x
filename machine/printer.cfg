[include mainsail.cfg]
# Klipper Configuration - V-Core 3 400x400mm
# Hardware: CAN Bus + BTT EBB42 v1.1 + Cartographer
#
# Corrections appliquées, référencées sur .RatOS_repo_backup/printers/v-core-3/
# Les lignes modifiées portent un commentaire « CORRIGÉ ».
#
# ÉTAT 2026-09-03 — machine opérationnelle : les 3 vis Z tournent, Z_TILT
#   converge, le bed mesh adaptatif fonctionne.
#   Extrudeur   : HGX Lite (réducteur 9.5:1) — rotation_distance 5.56 calibré
#   PEI         : 400x400 (remplace l'ancien 350x350)
#   Plateau     : coussin 400x400, 230 V AC 1400 W piloté par SSR
#   Capteur SFS : include commenté (capteur muet, voir ligne [include] plus bas)
[include macros-utiles.cfg]
[include resonance-macros.cfg]
# Capteur SFS désactivé le 2026-09-03 : QUERY_FILAMENT_SENSOR répond
# « filament not detected » en permanence (aucune impulsion reçue) et il
# mettait l'impression en PAUSE juste après la ligne de purge.
# ⚠️ Un capteur de filament Klipper est ACTIF PAR DÉFAUT : commenter le
#    SET_FILAMENT_SENSOR ENABLE=1 dans START_PRINT ne suffisait pas.
# Pour le réparer : tourner la roue du SFS et regarder sa LED — si elle
#    clignote c'est le fil signal (PB7), sinon c'est l'alimentation (VS/5V).
#[include filament-sensor.cfg]
[include ai-detection.cfg] 


#############################################################################################################
### PRINTER CONFIGURATION
#############################################################################################################

[printer]
kinematics: corexy
max_velocity: 300                # CORRIGÉ — était 500
max_accel: 3000                  # CORRIGÉ — était 10000 (profil performance RatOS = 15000,
                                 #           interdit sans refroidissement actif des drivers)
minimum_cruise_ratio: 0.5        # CORRIGÉ — absent ; RatOS le fixe dans ses deux profils
max_z_velocity: 15
max_z_accel: 30                  # CORRIGÉ — était 300, soit 2× le profil performance (150)
                                 #           et 10× le profil basic (30). Cause du grognement
                                 #           des moteurs Z au départ de chaque mouvement.
square_corner_velocity: 5.0

#############################################################################################################
### CANBUS U2C ADAPTER
#############################################################################################################
# Le U2C est un pont USB↔CAN : il crée l'interface can0, il ne pilote rien.
# Le déclarer en [mcu] ajoute un nœud qui doit répondre au démarrage, pour rien.

#[mcu u2c]
#canbus_uuid: 6092d36469e1

#############################################################################################################
### CONTROL BOARD - MAIN MCU
#############################################################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_260035000251313133353932-if00
restart_method: command

#############################################################################################################
### TOOLHEAD - BTT EBB42 v1.1
#############################################################################################################

[mcu toolhead]
canbus_interface: can0
canbus_uuid: e3be9642b024

#############################################################################################################
### STEPPER MOTORS
#############################################################################################################
# Câblage réel de cette machine (l'extrudeur étant sur l'EBB42, MOTOR2 est
# libre et les trois Z sont décalés d'un cran par rapport au plan RatOS) :
#   MOTOR0 = X   MOTOR1 = Y
#   MOTOR2 = stepper_z   → vis ARRIÈRE
#   MOTOR3 = stepper_z1  → vis AVANT-GAUCHE
#   MOTOR5 = stepper_z2  → vis AVANT-DROITE   (MOTOR4 abandonné)

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
endstop_pin: ^toolhead:PB6
position_endstop: 0
position_max: 400
position_min: -5
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.9                 # CORRIGÉ — était 1.2, le plafond continu d'un TMC2209
                                 #           avec shunts 0,110 Ω. À remplacer par la valeur
                                 #           de .RatOS_repo_backup/printers/v-core-3/v-core-3.cfg
sense_resistor: 0.110
stealthchop_threshold: 0
                                 # CORRIGÉ — diag_pin et driver_SGTHRS retirés : résidus de
                                 #           l'époque sensorless, l'endstop X est le contact
                                 #           physique sur l'EBB42.

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: ^!PG9
position_endstop: 400
position_max: 400
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.9                 # CORRIGÉ — était 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z : vis ARRIÈRE ────────────────────────────────────────────────────
[stepper_z]
homing_retract_dist: 0
step_pin: PF11
dir_pin: !PG3                    # CORRIGÉ — inversé : un DISTANCE positif doit FAIRE
                                 #           DESCENDRE le plateau (convention Klipper)
enable_pin: !PG5
microsteps: 64
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -5
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z1 : vis AVANT-GAUCHE, sur MOTOR6 ──────────────────────────────────
# Déplacé de MOTOR3 (PG4/PC1/PA0, uart PC7) vers MOTOR6 : MOTOR3 ne
# délivrait aucun courant (moteur libre à la main), prouvé côté carte par
# échange des câbles. MOTOR6 est un slot neuf, jamais utilisé.
[stepper_z1]
step_pin: PE2
dir_pin: !PE3                    # ! provisoire — sens à confirmer par FORCE_MOVE
enable_pin: !PD4
microsteps: 64
rotation_distance: 4

[tmc2209 stepper_z1]
uart_pin: PE1
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ── Z2 : vis AVANT-DROITE, sur MOTOR7 ──────────────────────────────────
# Déplacé de MOTOR5 (PC13/PF0/PF1, uart PE4) vers MOTOR7 : MOTOR5 alimentait
# le moteur mais ne le faisait pas tourner. MOTOR7 est un slot neuf.
# (MOTOR4 avait déjà été abandonné auparavant.)
[stepper_z2]
step_pin: PE6
dir_pin: !PA14                   # ! provisoire — sens à confirmer par FORCE_MOVE
enable_pin: !PE0
microsteps: 64
rotation_distance: 4

[tmc2209 stepper_z2]
uart_pin: PD3
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#############################################################################################################
### Z TILT — mise à plat du plateau sur les trois vis
#############################################################################################################
# Coordonnées reprises de .RatOS_repo_backup/printers/v-core-3/400.cfg.
# RatOS y documente son propre ordre : stepper_z = gauche (0,0),
# z1 = arrière (200,400), z2 = droite (400,0). Le câblage de cette machine
# étant différent, les mêmes coordonnées sont réordonnées : la Nème ligne
# décrit la vis entraînée par le Nème stepper.
#
# ⚠️ NE PAS lancer Z_TILT_ADJUST avant que les trois vis tournent ET que le
#    plateau soit mis à plat à la main.

[z_tilt]
z_positions:
    200,400                      # stepper_z  → moteur ARRIÈRE
    0,0                          # stepper_z1 → moteur AVANT-GAUCHE
    400,0                        # stepper_z2 → moteur AVANT-DROITE
points:
    40,40                        # vis AVANT-GAUCHE (0,0)
    200,370                      # vis ARRIÈRE (200,400) — sonde à y=370 donc tête à
                                 # y=348,9 avec l'offset Cartographer +21,1 : dans la course
    370,40                       # vis AVANT-DROITE (400,0)
horizontal_move_z: 20
speed: 300
retries: 10
retry_tolerance: 0.02

#############################################################################################################
### HEATER BED
#############################################################################################################

# Coussin 400x400 — 230 V AC 1400 W piloté par SSR (posé le 2026-09-03).
# La carte ne commute que la commande du SSR : aucun courant fort sur l'Octopus.
#
# pwm_cycle_time — INDISPENSABLE avec un SSR secteur. Un SSR à détection de
#   zéro ne peut commuter qu'aux passages par zéro du 50 Hz, soit toutes les
#   10 ms. Le défaut Klipper (0,100 s) le hache de façon erratique : régulation
#   instable et usure prématurée du SSR. 0,3 s = plusieurs alternances par
#   cycle, commutation propre.
# max_power — 1400 W sur 1600 cm² = 0,875 W/cm², c'est très violent : à pleine
#   puissance le plateau dépasse largement la consigne avant de redescendre.
#   Bridé à 60 % il chauffe encore très vite, sans overshoot.
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950        # = NTC 100K B3950 : correspond à la sonde du coussin
sensor_pin: PF3
control: pid
pid_kp: 54.027                   # ⚠️ VALEURS DE L'ANCIEN COUSSIN — à recalibrer :
pid_ki: 0.770                    #    PID_CALIBRATE HEATER=heater_bed TARGET=80
pid_kd: 948.182                  #    puis SAVE_CONFIG
min_temp: 0
max_temp: 120
max_power: 0.6
pwm_cycle_time: 0.3

#############################################################################################################
### TEMPERATURE SENSORS
#############################################################################################################

[temperature_sensor MainBoard]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead]
sensor_type: temperature_mcu
sensor_mcu: toolhead
min_temp: 0
max_temp: 100

#[temperature_sensor Chamber]
#sensor_type: Generic 3950
#sensor_pin: PF4
#min_temp: 0
#max_temp: 100
#gcode_id: chamber

#############################################################################################################
### CARTOGRAPHER PROBE
#############################################################################################################

# Module scanner.py (et non l'ancien cartographer.py) : c'est le module
# maintenu, écrit pour la nouvelle API « probe session » de Klipper (résultats
# avec .bed_z). cartographer.py renvoyait des listes et plantait au premier
# G28 Z / Z_TILT_ADJUST sur ce Klipper récent. Voir DEPANNAGE panne 7.
# Gabarit officiel : cartographer-klipper/scripts/setup.py.

[mcu scanner]
canbus_uuid: 4973681e12df

[scanner]
mcu: scanner
x_offset: 0
y_offset: 21.1
backlash_comp: 0.5
sensor: cartographer
sensor_alt: carto
mesh_runs: 2

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

#############################################################################################################
### EXTRUDER (EBB42)
#############################################################################################################

[extruder]
step_pin: toolhead:PD0
dir_pin: toolhead:PD1
enable_pin: !toolhead:PD2
microsteps: 16
rotation_distance: 5.56    # HGX Lite
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead:PB13
sensor_type: PT1000
sensor_pin: toolhead:PA3
# Si la température de buse est décalée au repos, c'est le pullup : l'EBB42
# commute une résistance de précision par cavalier ou DIP. Déclarer alors
# pullup_resistor: <valeur du montage> (Klipper suppose 4700 par défaut).
min_temp: 0
max_temp: 300
max_extrude_only_distance: 500
max_extrude_cross_section: 5
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: toolhead:PA15
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 0

#############################################################################################################
### HOTEND FAN & PART COOLING
#############################################################################################################

[heater_fan hotend_fan]
pin: toolhead:PA1
heater: extruder
heater_temp: 50.0

[fan]
pin: toolhead:PA0

#############################################################################################################
### VENTILATEUR DE CARTE
#############################################################################################################
# CNC FAN2. Sans cette section le ventilateur ne démarrait jamais, alors que
# RatOS conditionne tout profil d'accélération élevé à un refroidissement
# actif des drivers.

[controller_fan board_fan]
pin: PD12
kick_start_time: 0.5             # CORRIGÉ — ajouté : démarrage franc du ventilateur
fan_speed: 1.0
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
heater: heater_bed

#############################################################################################################
### ADXL345 ACCELEROMETER
#############################################################################################################

[adxl345]
cs_pin: toolhead:PB12
spi_software_sclk_pin: toolhead:PB10
spi_software_mosi_pin: toolhead:PB11
spi_software_miso_pin: toolhead:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points: 200, 200, 20

#############################################################################################################
### BED MESH
#############################################################################################################

[bed_mesh]
zero_reference_position: 200, 200
mesh_min: 30, 30                 # PEI 400x400 depuis le 2026-09-03 (avant : 65,65).
mesh_max: 370, 370               #   Sonde à y=370 → tête à y=348,9 : OK. À y=30 → tête à 8,9 : OK.
speed: 200
horizontal_move_z: 2             # DOIT rester dans la plage du coil (model_range 0,1-5 mm).
                                 #   À 5 mm le coil sort de sa plage sur les zones basses
                                 #   → Z aberrants + « Mesh extends outside of fade range ».
probe_count: 15, 15
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

#############################################################################################################
### HOMING
#############################################################################################################

[safe_z_home]
home_xy_position: 200, 200
speed: 100
z_hop: 10
z_hop_speed: 15

[force_move]
enable_force_move: True
[exclude_object]
[gcode_macro _ON_LAYER_CHANGE]
gcode:
    {% set layer = params.LAYER|default(0)|int %}
    SET_PRINT_STATS_INFO CURRENT_LAYER={layer}
    # hook par couche : le timelapse ou d'autres actions peuvent se greffer ici
#############################################################################################################
### CHAMBER & LED CONTROL
#############################################################################################################

[fan_generic chamber_fan]
pin: PA8
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5

[gcode_macro CHAMBER_FAN_ON]
gcode:
    {% set speed = params.SPEED|default(1.0)|float %}
    SET_FAN_SPEED FAN=chamber_fan SPEED={speed}

[gcode_macro CHAMBER_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0

[output_pin cob_led]
pin: PB10
pwm: true
cycle_time: 0.01
value: 0
shutdown_value: 0

[neopixel chamber_leds]
pin: PB0
chain_count: 24
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[gcode_macro LED_ON]
gcode:
    SET_LED LED=chamber_leds RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LED_OFF]
gcode:
    SET_LED LED=chamber_leds RED=0 GREEN=0 BLUE=0

[gcode_macro LED_DIM]
gcode:
    SET_LED LED=chamber_leds RED=0.2 GREEN=0.2 BLUE=0.2

#############################################################################################################
### USER OVERRIDES & CUSTOM SETTINGS
#############################################################################################################

[gcode_macro _USER_START_PRINT_BEFORE_HOMING]
gcode:
    LED_ON
    CHAMBER_FAN_ON SPEED=0.5

[gcode_macro _USER_START_PRINT_AFTER_HEATING_BED]
gcode:
    # Custom commands after bed heating

[gcode_macro _USER_START_PRINT_BEFORE_HEATING_EXTRUDER]
gcode:
    # Custom commands before extruder heating

[gcode_macro _USER_START_PRINT_PARK]
gcode:
    # Custom park position

[gcode_macro _USER_END_PRINT_AFTER_HEATERS_OFF]
gcode:
    CHAMBER_FAN_ON SPEED=1.0
    LED_DIM

[gcode_macro _USER_END_PRINT_PARK]
gcode:
    # Custom park position for end print

#############################################################################################################
### MACROS D'IMPRESSION
#############################################################################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(230)|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    CLEAR_PAUSE
    G90
    M83
    _USER_START_PRINT_BEFORE_HOMING
    M140 S{BED}
    M190 S{BED}
    _USER_START_PRINT_AFTER_HEATING_BED
    G28
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    _USER_START_PRINT_BEFORE_HEATING_EXTRUDER
    # --- Présente la buse : lit BAS Z60 + centre X200 arrière (brosse pendant la chauffe) ---
    G90
    G1 Z60 F1500
    G1 X200 Y{max_y - 5} F6000
    M117 Nettoie la buse pendant la chauffe
    M109 S{HOTEND}
    # --- Ligne de purge SUR le PEI ---
    G1 Z5 F600
    G1 X60 Y50 F6000
    G1 Z0.3 F600
    G92 E0
    G1 X220 Y50 E15 F1200
    G1 Z2 F600
    G92 E0
  #  SET_FILAMENT_SENSOR SENSOR=SFS ENABLE=1
    M117 Impression...
  

[gcode_macro END_PRINT]
gcode:
    M400
  #  SET_FILAMENT_SENSOR SENSOR=SFS ENABLE=0
    G91
    G1 E-3 F1800
    G1 Z10 F600
    G90
    TURN_OFF_HEATERS
    _USER_END_PRINT_AFTER_HEATERS_OFF
    M107
    _USER_END_PRINT_PARK
    G1 Z{printer.toolhead.position.z + 30} F1500
    G1 X200 Y{printer.toolhead.axis_maximum.y - 10} F6000
    M84

