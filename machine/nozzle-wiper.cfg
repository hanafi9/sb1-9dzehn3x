#############################################################################################################
### NETTOYAGE DE BUSE — brosse FIXE vissée sur le châssis
###
### Pourquoi aucun servo/moteur n'est nécessaire sur une VCore 3 :
###   le portique est FIXE en Z (c'est le plateau qui monte et descend), donc la
###   pointe de buse est TOUJOURS à la même hauteur absolue dans l'espace. Une
###   brosse vissée sur le châssis à cette hauteur est donc toujours pile au bon
###   niveau. On descend simplement le plateau et on balaie en XY.
###
### Montage conseillé : support Z arrière, 2 vis M6x14 + écrous à marteau.
###   Garniture : bande caoutchouc 1,6 mm, ou brosse silicone de Bambu A1 mini
###   (consommable bon marché, ne raye pas la buse contrairement au laiton).
#############################################################################################################

#############################################################################################################
### ⚠️ À RÉGLER AVANT LA PREMIÈRE UTILISATION
###
### 1. Monte la brosse, puis dans Mainsail : G28, puis descends le plateau
###    (par ex. G1 Z80) pour qu'il ne gêne pas.
### 2. Déplace la tête À LA MAIN depuis les contrôles Mainsail jusqu'à ce que la
###    buse soit juste à l'ENTRÉE de la brosse. Relève X et Y → x_start / y.
### 3. Déplace-la jusqu'à la SORTIE de la brosse. Relève X → x_end.
### 4. Reporte ces valeurs ci-dessous, puis ENREGISTRER ET REDÉMARRER.
###
### 🛟 Sécurité : commence avec un balayage LENT (speed: 3000) pour vérifier que
###    la trajectoire est bonne, puis remonte la vitesse.
#############################################################################################################

[gcode_macro _WIPE_CONF]
variable_x_start:   10      # X — entrée de la brosse (mm)
variable_x_end:     60      # X — sortie de la brosse (mm)
variable_y:        395      # Y — position de la brosse (mm)
variable_z_clear:   60      # Z — plateau descendu pendant l'essuyage (mm)
variable_passes:     6      # nombre d'allers-retours
variable_speed:   6000      # vitesse de balayage (mm/min) — 6000 = 100 mm/s
variable_temp:     180      # température d'essuyage (°C)
gcode:
    # bloc de variables uniquement — pas de gcode ici

#############################################################################################################
### CLEAN_NOZZLE — essuyage manuel ou appelé depuis START_PRINT
###
###   CLEAN_NOZZLE                    → valeurs par défaut ci-dessus
###   CLEAN_NOZZLE TEMP=200           → force la température d'essuyage
###   CLEAN_NOZZLE PASSES=10          → plus d'allers-retours (buse très sale)
#############################################################################################################

[gcode_macro CLEAN_NOZZLE]
description: Essuie la buse sur la brosse fixe du châssis
gcode:
    {% set c      = printer["gcode_macro _WIPE_CONF"] %}
    {% set temp   = params.TEMP|default(c.temp)|float %}
    {% set passes = params.PASSES|default(c.passes)|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing avant nettoyage...
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=clean_nozzle
    M117 Nettoyage buse...
    G90

    # Le plateau descend AVANT tout déplacement XY : la tête doit pouvoir
    # traverser sans risque de toucher le plateau ou une pièce en cours.
    G1 Z{c.z_clear} F1500

    # Chauffe pendant le trajet : assez chaud pour ramollir le résidu,
    # assez froid pour qu'il ne coule pas (180 °C est un bon compromis).
    M104 S{temp}
    G1 X{c.x_start} Y{c.y} F{c.speed}
    M109 S{temp}

    # Balayage : la brosse est à hauteur fixe, seul le XY bouge.
    {% for i in range(passes) %}
        G1 X{c.x_end}   F{c.speed}
        G1 X{c.x_start} F{c.speed}
    {% endfor %}

    M117 Buse propre
    RESTORE_GCODE_STATE NAME=clean_nozzle

#############################################################################################################
### INTÉGRATION DANS START_PRINT
###
### Dans printer.cfg, macro START_PRINT, ajoute CLEAN_NOZZLE juste APRÈS la
### chauffe de la buse et AVANT la ligne de purge :
###
###     M109 S{HOTEND}
###     CLEAN_NOZZLE                 <-- ici
###     # --- Ligne de purge SUR le PEI ---
###     G1 Z5 F600
###     ...
###
### Et éventuellement dans END_PRINT (buse encore chaude = nettoyage plus
### efficace, et la machine repart propre au print suivant) :
###
###     TURN_OFF_HEATERS
###     CLEAN_NOZZLE TEMP=180        <-- avant de couper, sinon ça ne chauffe plus
#############################################################################################################
