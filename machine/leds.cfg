# ═══════════════════════════════════════════════════════════════════
#  leds.cfg — Éclairage d'état pour VCore 3.1
#  Les animations sont dans led-effects.cfg (module klipper-led_effect)
#  Neopixels (couleurs) + COB (intensité seule — un COB est monochrome)
#
#  Installation :
#    1. Copier ce fichier dans ~/printer_data/config/leds.cfg
#    2. Ajouter dans printer.cfg :  [include leds.cfg]
#    3. Adapter les DEUX variables ci-dessous aux noms réels de tes
#       sections (grep "^\[neopixel\|^\[output_pin" printer.cfg)
#    4. FIRMWARE_RESTART
#
#  Couleurs par étape :
#    Chargement fichier   blanc chaud
#    Homing               cyan
#    Chauffe bed/buse     bleu (dégradé vers rouge quand Klipper a la main)
#    Z-Tilt               violet
#    Bed mesh             vert d'eau
#    Impression           blanc plein
#    Pause                orange
#    Terminé              vert
#    Erreur               rouge
# ═══════════════════════════════════════════════════════════════════

[gcode_macro _LED_VARS]
# ── Adapter ces deux noms à ta config ──────────────────────────────
# Un seul ruban pour l'instant : le FCOB WS2811 sur PB0. Les deux variables
# pointent donc au même endroit, et variable_cob est laissée vide pour que
# _COB ne vienne pas écraser en blanc la couleur posée par _LED_RGB.
# Quand un second ruban reviendra sur sa propre broche, remettre
# variable_neopixel: 'chamber_leds' et variable_cob: 'cob_led'.
variable_neopixel: 'cob_led'
variable_cob: ''
# ── État interne — ne pas modifier ─────────────────────────────────
variable_heat_heater: ''
variable_last_state: ''
gcode:
    # Section porte-variables, rien à exécuter

# ─── Primitives ────────────────────────────────────────────────────

[gcode_macro _LED_RGB]
description: Colore toute la chaîne neopixel. Params: R G B (0.0-1.0)
gcode:
    {% set v = printer["gcode_macro _LED_VARS"] %}
    SET_LED LED={v.neopixel} RED={params.R|default(0)} GREEN={params.G|default(0)} BLUE={params.B|default(0)} TRANSMIT=1

[gcode_macro _COB]
description: Intensité du COB. Param: V (0.0-1.0)
gcode:
    # Le COB est un ruban adressable WS2811, pas une sortie PWM : on écrit donc
    # du blanc à l'intensité demandée sur toute la chaîne, ce qui donne le même
    # comportement qu'une gradation. Tous les STATUS_* restent inchangés.
    #
    # Si variable_cob est vide, il n'y a qu'un seul ruban et c'est _LED_RGB qui
    # le pilote : ne rien faire, sinon on écraserait sa couleur par du blanc.
    {% set v = printer["gcode_macro _LED_VARS"] %}
    {% if v.cob %}
        {% set i = params.V|default(0)|float %}
        SET_LED LED={v.cob} RED={i} GREEN={i} BLUE={i} TRANSMIT=1
    {% endif %}

# ─── États ─────────────────────────────────────────────────────────

[gcode_macro STATUS_READY]
description: Veille — lueur froide qui respire
gcode:
    _LED_STOP_HEAT_LOOP
    SET_LED_EFFECT EFFECT=ef_veille REPLACE=1

[gcode_macro STATUS_LOADING]
description: Chargement du fichier — balayage cyan
gcode:
    SET_LED_EFFECT EFFECT=ef_homing REPLACE=1

[gcode_macro STATUS_HOMING]
description: Homing — balayage cyan rapide
gcode:
    SET_LED_EFFECT EFFECT=ef_homing REPLACE=1

[gcode_macro STATUS_HEATING_BED]
description: Chauffe du lit — comete bleue lente
gcode:
    # led_effect anime en tache de fond, donc l'animation continue pendant
    # M190 — ce que la boucle delayed_gcode precedente ne pouvait pas faire.
    SET_LED_EFFECT EFFECT=ef_chauffe_lente REPLACE=1

[gcode_macro STATUS_HEATING_NOZZLE]
description: Chauffe de la buse — comete bleue rapide
gcode:
    SET_LED_EFFECT EFFECT=ef_chauffe_rapide REPLACE=1

[gcode_macro STATUS_LEVELING]
description: Z-Tilt — comete violette
gcode:
    SET_LED_EFFECT EFFECT=ef_zilt REPLACE=1

[gcode_macro STATUS_MESHING]
description: Bed mesh — balayage vert d'eau
gcode:
    SET_LED_EFFECT EFFECT=ef_mesh REPLACE=1

[gcode_macro STATUS_PRINTING]
description: Impression — blanc fixe (voir led-effects.cfg)
gcode:
    SET_LED_EFFECT EFFECT=ef_impression REPLACE=1

[gcode_macro STATUS_PAUSED]
description: Pause — orange qui respire
gcode:
    SET_LED_EFFECT EFFECT=ef_pause REPLACE=1

[gcode_macro STATUS_DONE]
description: Impression terminée — vert qui respire
gcode:
    SET_LED_EFFECT EFFECT=ef_fini REPLACE=1

[gcode_macro STATUS_ERROR]
description: Erreur — rouge stroboscopique
gcode:
    SET_LED_EFFECT EFFECT=ef_erreur REPLACE=1

[gcode_macro LEDS_OFF]
description: Tout éteindre
gcode:
    _LED_STOP_HEAT_LOOP
    STOP_LED_EFFECTS
    _LED_RGB R=0 G=0 B=0

[gcode_macro _LED_STOP_HEAT_LOOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_LED_VARS VARIABLE=heat_heater VALUE='""'

[delayed_gcode _LED_HEAT_LOOP]
gcode:
    {% set v = printer["gcode_macro _LED_VARS"] %}
    {% if v.heat_heater %}
        {% set h = printer[v.heat_heater] %}
        {% if h.target > 0 %}
            {% set start = 25.0 %}
            {% set span = (h.target - start)|float %}
            {% set ratio = ((h.temperature - start) / span)|float if span > 0 else 1.0 %}
            {% set ratio = [1.0, [0.0, ratio]|max]|min %}
            _LED_RGB R={ratio|round(3)} G=0 B={(1.0 - ratio)|round(3)}
            {% if h.temperature < h.target - 1.0 %}
                UPDATE_DELAYED_GCODE ID=_LED_HEAT_LOOP DURATION=2
            {% else %}
                # Consigne atteinte — rouge plein, fin de boucle
                _LED_RGB R=1.0 G=0 B=0
                SET_GCODE_VARIABLE MACRO=_LED_VARS VARIABLE=heat_heater VALUE='""'
            {% endif %}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_LED_VARS VARIABLE=heat_heater VALUE='""'
        {% endif %}
    {% endif %}

# ─── Veilleur de pause ─────────────────────────────────────────────
# Surveille print_stats.state toutes les 3 s. Réagit UNIQUEMENT aux
# transitions pause/reprise/fin/erreur — jamais au passage standby →
# printing, pour ne pas écraser les couleurs d'étape de START_PRINT.

[delayed_gcode _LED_STATE_WATCH]
initial_duration: 5
gcode:
    {% set v = printer["gcode_macro _LED_VARS"] %}
    {% set s = printer.print_stats.state %}
    {% if s != v.last_state %}
        {% if s == 'paused' %}
            STATUS_PAUSED
        {% elif s == 'printing' and v.last_state == 'paused' %}
            STATUS_PRINTING
        {% elif s == 'complete' %}
            STATUS_DONE
        {% elif s == 'error' %}
            STATUS_ERROR
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_LED_VARS VARIABLE=last_state VALUE='"{s}"'
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_LED_STATE_WATCH DURATION=3

# ─── Ruban FCOB WS2811 — test et usage courant ─────────────────────

[gcode_macro COB_TEST]
description: Verifie cablage, color_order et chain_count du ruban FCOB
gcode:
    # Trois couleurs pures puis du blanc, 2 s chacune. Ce qu'on regarde :
    #
    #   COULEURS JUSTES        -> color_order: RGB est bon
    #   rouge et vert inverses -> passer color_order en GRB
    #   bleu et rouge inverses -> passer color_order en BRG
    #
    #   TOUTE LA LONGUEUR s'allume -> chain_count suffisant
    #   seul le debut s'allume     -> chain_count trop petit, l'augmenter
    #
    # chain_count trop GRAND est sans consequence : les donnees au-dela du
    # dernier IC ne sont recues par personne. Voir large plutot que juste.
    M117 COB_TEST — ROUGE
    SET_LED LED=cob_led RED=1 GREEN=0 BLUE=0 TRANSMIT=1
    G4 P2000
    M117 COB_TEST — VERT
    SET_LED LED=cob_led RED=0 GREEN=1 BLUE=0 TRANSMIT=1
    G4 P2000
    M117 COB_TEST — BLEU
    SET_LED LED=cob_led RED=0 GREEN=0 BLUE=1 TRANSMIT=1
    G4 P2000
    M117 COB_TEST — BLANC
    SET_LED LED=cob_led RED=1 GREEN=1 BLUE=1 TRANSMIT=1

[gcode_macro LUMIERE]
description: Lumière blanche fixe. Param: V (0.0-1.0, défaut 1.0)
gcode:
    # Eclairage de travail : fixe, sans animation. STOP_LED_EFFECTS est
    # indispensable — une animation en cours reecrirait le ruban a la
    # trame suivante et effacerait ce blanc.
    {% set i = params.V|default(1.0)|float %}
    _LED_STOP_HEAT_LOOP
    STOP_LED_EFFECTS
    _LED_RGB R={i} G={i} B={i}

[gcode_macro LUMIERE_OFF]
description: Eteint le caisson
gcode:
    LEDS_OFF
